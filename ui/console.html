<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VM console</title>
  <link rel="stylesheet" href="/assets/theme.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--font-sans); }
    #app { display: flex; flex-direction: column; height: 100%; }
    #bar {
      flex: none; display: flex; align-items: center; gap: 7px;
      padding: 5px 10px; min-height: 34px;
      background: color-mix(in srgb, var(--panel) 88%, var(--bg-inset));
      border-bottom: 1px solid var(--line);
      user-select: none; overflow-x: auto; white-space: nowrap;
    }
    #bar button { flex: none; }
    #bar button.active { border-color: var(--mint); color: var(--mint); }
    #name { color: var(--ink); font-weight: 600; }
    #state { color: var(--muted); font-size: 11.5px; }
    #spacer { flex: 1; }
    button {
      border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
      border-radius: var(--radius-sm); padding: 4px 9px; font: inherit; cursor: pointer;
    }
    button:hover { border-color: var(--focus-border); color: var(--ink); }
    #screen {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
      background: var(--bg-inset); outline: none;
    }
    #screen canvas { cursor: default; }
    #overlay {
      position: absolute; inset: 34px 0 0 0; display: grid; place-items: center;
      pointer-events: none;
      background: radial-gradient(60% 60% at 50% 45%, color-mix(in srgb, var(--bg) 72%, transparent), color-mix(in srgb, var(--bg) 96%, transparent));
      transition: opacity .2s ease;
    }
    #overlay[hidden] { display: none; }
    .card {
      pointer-events: auto; max-width: 420px; padding: 20px 22px; text-align: center;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card h1 { margin: 0 0 6px; font-size: 16px; color: var(--ink); font-weight: 650; }
    .card p { margin: 0; color: var(--muted); }
    .card .err { color: var(--red); }
    .spinner {
      width: 26px; height: 26px; margin: 0 auto 12px;
      border: 2px solid var(--line); border-top-color: var(--mint);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #hint { font-family: var(--font-mono); font-size: 11px; opacity: .75; margin-top: 12px; }

    /* Slim "type to the VM" field; focusing it summons the phone keyboard. */
    #kbd {
      position: fixed; left: 8px; right: 8px; bottom: 8px;
      height: 36px; width: auto;
      padding: 0 12px; margin: 0;
      font-size: 16px; line-height: 34px;
      color: var(--ink); background: var(--input-bg);
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      resize: none; outline: none; display: none; z-index: 6;
    }
    #kbd.visible { display: block; }
    #kbd:focus { border-color: var(--focus-border); }
  </style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1b26'/%3E%3Cpath d='M9 22V10l7 7 7-7v12' fill='none' stroke='%237aa2f7' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <div id="bar">
      <span id="name">VM console</span>
      <span id="state">connecting…</span>
      <span id="spacer"></span>
      <button id="keyboard" title="Show the device keyboard">⌨ Keyboard</button>
      <button id="ctrl" title="Ctrl for the next key">Ctrl</button>
      <button id="alt" title="Alt for the next key">Alt</button>
      <button id="shift" title="Shift for the next key">Shift</button>
      <button id="super" title="Super/Meta for the next key">Super</button>
      <button id="backspace" title="Backspace">⌫</button>
      <button id="enter" title="Return">⏎</button>
      <button id="tab" title="Tab">Tab</button>
      <button id="esc" title="Escape">Esc</button>
      <button id="reconnect" title="Reconnect">⟳ Reconnect</button>
      <button id="fullscreen" title="Fullscreen">⛶</button>
    </div>
    <div id="screen" tabindex="0"></div>
  </div>
  <textarea id="kbd" aria-label="Type to the virtual machine"
            placeholder="Type to the VM…" rows="1"
            autocomplete="off" autocapitalize="off" autocorrect="off"
            spellcheck="false" inputmode="text"></textarea>
  <div id="overlay">
    <div class="card">
      <div class="spinner" id="spinner"></div>
      <h1 id="overlayTitle">Connecting to the VM…</h1>
      <p id="overlayText">Opening the framebuffer.</p>
      <p id="hint">Tap Keyboard for your phone's keyboard. On desktop, click the screen to capture the keyboard; Ctrl+Alt+G releases the pointer.</p>
    </div>
  </div>
  <script>
    // Keep client-side failures visible instead of leaving a forever spinner.
    function consoleError(title, text) {
      const overlay = document.getElementById("overlay");
      const spinner = document.getElementById("spinner");
      if (!overlay) return;
      overlay.hidden = false;
      if (spinner) spinner.style.display = "none";
      const t = document.getElementById("overlayTitle");
      const p = document.getElementById("overlayText");
      if (t) t.textContent = title;
      if (p) p.textContent = String(text || "Unknown error");
    }
    window.addEventListener("error", (e) => consoleError("Console script error", e.message));
    window.addEventListener("unhandledrejection", (e) => {
      const reason = e.reason && (e.reason.message || e.reason);
      consoleError("Console script error", reason);
    });
  </script>
  <script type="module" src="./console.js"></script>
</body>
</html>
